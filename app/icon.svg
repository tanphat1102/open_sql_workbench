<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient nền màu xanh dương đặc trưng của Data/SQL -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  
  <!-- Hình nền bo góc -->
  <rect width="512" height="512" rx="112" fill="url(#dbGrad)"/>

  <!-- Tầng dữ liệu trên cùng (Database Top) -->
  <ellipse cx="256" cy="150" rx="140" ry="50" fill="#bae6fd"/>

  <!-- Tầng dữ liệu giữa (Database Middle) -->
  <path d="M116 150 v80 c0 27.6 62.7 50 140 50 s140-22.4 140-50 v-80 Z" fill="#7dd3fc" opacity="0.9"/>

  <!-- Tầng dữ liệu dưới cùng (Database Bottom) -->
  <path d="M116 230 v80 c0 27.6 62.7 50 140 50 s140-22.4 140-50 v-80 Z" fill="#38bdf8" opacity="0.8"/>

  <!-- Ký hiệu dấu nhắc lệnh tương tác (Interactive Terminal Prompt: >_ ) -->
  <path d="M170 290 L240 330 L170 370" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="370" x2="350" y2="370" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
</svg>
